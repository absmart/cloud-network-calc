# Test, build and deploy the app to Azure Static Web Apps (swa-cloud-network-calc).
#
# - A pull request into main runs the tests and the type-checked build, then
#   deploys to its own preview environment, whose URL the action posts as a
#   PR comment. The Free plan allows 3 preview environments at once.
# - When the tests and build pass on a pull request the repository owner opened
#   from a branch of this repository, it is merged into main automatically
#   (unless it is a draft or has the "hold" label), and production is deployed.
# - A push to main deploys to production. Closing a PR removes its preview.
#
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN: the Static Web
# App's deployment token.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  workflow_dispatch:

# One run at a time per pull request (or for production); a newer push cancels a run that hasn't finished.
concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Branch protection on main requires this check by its name.
    name: Tests and build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      # Type-checks (strict, no unused code) before building.
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To comment the preview URL on the pull request.
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Already built by the check job, so upload dist/ as is.
          app_location: dist
          skip_app_build: true
          api_location: ''

  auto-merge:
    name: Merge into main
    # After the preview deploy too: it must work, and must finish before the preview is removed.
    needs: [check, deploy]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To start the production deploy after merging.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      # Read the PR now rather than from the event, so marking it as a draft or
      # adding "hold" while the checks run still stops the merge.
      - name: Check the pull request may be merged
        id: ready
        run: |
          state=$(gh pr view "$PR" --json isDraft,labels --jq '[.isDraft, ([.labels[].name] | index("hold") != null)] | @tsv')
          if [ "$state" = "$(printf 'false\tfalse')" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not merging: the pull request is a draft or has the \"hold\" label."
          fi

      - name: Merge
        if: steps.ready.outputs.merge == 'true'
        run: |
          gh pr merge "$PR" --rebase
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"

      # A merge made with the workflow's token doesn't start other workflow
      # runs, so start the production deploy (which tests main again) here.
      - name: Deploy production
        if: steps.ready.outputs.merge == 'true'
        run: gh workflow run deploy.yml --ref main

      # For the same reason the "closed" run below won't happen, so remove the preview here.
      - name: Remove the preview environment
        if: steps.ready.outputs.merge == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
