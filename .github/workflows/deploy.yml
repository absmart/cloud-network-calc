# Test, build and deploy the app to Azure Static Web Apps (swa-cloud-network-calc).
# A push to main deploys to production. A pull request into main deploys to
# its own preview environment, whose URL the action posts as a PR comment, and
# closing the PR removes it. The Free plan allows 3 preview environments at once.
# Needs the repository secret AZURE_STATIC_WEB_APPS_API_TOKEN: the Static Web
# App's deployment token.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time per environment; a newer push cancels a deploy that hasn't finished.
concurrency:
  group: deploy-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  # To comment the preview URL on the pull request.
  pull-requests: write

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          # Already built above, so upload dist/ as is.
          app_location: dist
          skip_app_build: true
          api_location: ''

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: ''
